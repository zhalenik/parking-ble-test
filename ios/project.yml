name: ParkingBLEProbe
options:
  bundleIdPrefix: com.parkingble.probe
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ParkingBLEProbe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ParkingBLEProbe
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkingble.probe.ios
        PRODUCT_NAME: ParkingBLEProbe
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ParkingBLEProbe/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SUPPORTS_MACCATALYST: NO
schemes:
  ParkingBLEProbe:
    build:
      targets:
        ParkingBLEProbe: all
    run:
      config: Debug
    archive:
      config: Release
