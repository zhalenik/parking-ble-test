name: Build ESP32 C3 test firmware
on:
  push:
    branches: [main]
    paths:
      - 'esp32-ibeacon/**'
      - 'esp32-gatt/**'
      - '.github/workflows/build-esp32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [esp32-ibeacon, esp32-gatt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile firmware
        run: pio run -d ${{ matrix.name }}
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: |
            ${{ matrix.name }}/.pio/build/*/firmware.bin
            ${{ matrix.name }}/.pio/build/*/bootloader.bin
            ${{ matrix.name }}/.pio/build/*/partitions.bin
          if-no-files-found: error
